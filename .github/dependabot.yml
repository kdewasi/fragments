version: 2
updates:
  - package-ecosystem: npm
    directory: /fragments-backend
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /fragments-ui
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: docker
    directory: /fragments-backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /fragments-ui
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
