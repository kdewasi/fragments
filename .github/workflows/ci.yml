name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only needs to read the repository; the Docker Hub job uses secrets, not the token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HURL_VERSION: 6.1.1

jobs:
  backend:
    name: Backend (lint, unit tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fragments-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: fragments-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests with coverage thresholds
        run: npm run coverage
      - name: Audit production dependencies
        run: npm run audit:prod

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fragments-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: fragments-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm run audit:prod

  dockerfile-lint:
    name: Dockerfile lint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - fragments-backend/Dockerfile
          - fragments-ui/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  integration:
    name: Integration tests (Docker Compose + Hurl)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fragments-backend
    steps:
      - uses: actions/checkout@v5

      - name: Install Hurl
        run: |
          curl -sSL --fail -o /tmp/hurl.tar.gz \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/hurl.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin/hurl" /usr/local/bin/hurl
          hurl --version

      - name: Start the API, DynamoDB Local and LocalStack
        run: docker compose up -d --build

      - name: Create the local S3 bucket and DynamoDB table
        run: ./scripts/local-aws-setup.sh

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose ps
          docker compose logs fragments
          exit 1

      - name: Run Hurl tests
        run: npm run test:integration

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs fragments

      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-hub:
    name: Publish backend image to Docker Hub
    needs: [backend, frontend, dockerfile-lint, integration]
    # Only on pushes to main (pull requests, including from forks, never see the secrets)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./fragments-backend
          file: ./fragments-backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fragments:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fragments:main
            ${{ secrets.DOCKERHUB_USERNAME }}/fragments:latest
