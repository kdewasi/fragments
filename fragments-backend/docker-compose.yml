# Local stack: the API backed by DynamoDB Local (metadata) and LocalStack S3 (data).
#
#   docker compose up -d --build
#   ./scripts/local-aws-setup.sh      # creates the bucket and table
#   npm run test:integration          # Hurl tests against http://localhost:8080
#
# Authentication is HTTP Basic with the test users in tests/.htpasswd, which is
# mounted read-only (the image itself contains no credentials).

services:
  fragments:
    build: .
    init: true
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
      API_URL: http://localhost:8080
      HTPASSWD_FILE: /app/tests/.htpasswd
      RATE_LIMIT_MAX: 10000
      # A region enables the AWS storage backend (pointed at the local containers)
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_ENDPOINT_URL: http://localstack:4566
      AWS_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-fragments}
      AWS_DYNAMODB_TABLE_NAME: ${AWS_DYNAMODB_TABLE_NAME:-fragments}
    volumes:
      - ./tests/.htpasswd:/app/tests/.htpasswd:ro
    depends_on:
      localstack:
        condition: service_healthy
      dynamodb-local:
        condition: service_started

  # https://hub.docker.com/r/amazon/dynamodb-local
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ['-jar', 'DynamoDBLocal.jar', '-inMemory', '-sharedDb']
    ports:
      - '8000:8000'

  # https://docs.localstack.cloud/getting-started/installation/#docker-compose
  localstack:
    image: localstack/localstack:4
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3
      EAGER_SERVICE_LOADING: 1
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
