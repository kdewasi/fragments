# Serves the built SPA. Runs in nginxinc/nginx-unprivileged, which listens on 8080.
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers (declared once at server level; locations below must not
  # use add_header, or these would stop being inherited)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:8080; frame-src 'self' https://*.amazoncognito.com; form-action 'self' https://*.amazoncognito.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Never cache the service worker or the HTML shell
  location = /sw.js {
    expires -1;
  }
  location = /index.html {
    expires -1;
  }

  # Hashed build assets can be cached for a long time
  location /assets/ {
    expires 1y;
  }

  # SPA routing (including the /callback route used by Cognito)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
